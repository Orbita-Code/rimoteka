server {
    # `default_server` je OBAVEZAN i nije ukras.
    #
    # 29.07.2026. je sajt bio oboren ~3 minuta zato što je ovo nedostajalo:
    # `server_name _` NIJE hvatalica za sve domene — `_` je namerno nevažeće ime
    # koje se nikad ne poklopi sa `Host` zaglavljem. Ovaj blok je hvatao sve
    # zahteve samo zato što je bio PRVI, a nginx prvi blok uzima za podrazumevani
    # kad nijedan nema `default_server`. Čim je ispred njega dodat blok za www,
    # www je postao podrazumevani i preusmeravao je i `rimoteka.com` na samog
    # sebe — beskonačna petlja.
    #
    # Sa izričitim `default_server` redosled blokova više ništa ne znači.
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relativni redirecti (Location: /) da se sačuva https i izbegne http→https chain
    absolute_redirect off;

    # Gzip da se veliki rečnik (reci.txt ~3MB) brzo učita
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Sigurnosni hederi (primenjuju se na sve odgovore) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://sr.wiktionary.org https://sr.wikipedia.org https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;

    # Definicije se često dopunjuju — bez keša, da svi uvek vide najnovije
    location = /definicije.json {
        expires epoch;
    }

    # Rečnik (reci.txt / reci_jekavica.txt) se menja — uvek revalidiraj (ETag → 304)
    # da izmene/čišćenja rečnika ODMAH stignu korisnicima, a ne tek za 7 dana.
    location ~* /reci(_jekavica)?\.txt$ {
        expires epoch;
    }

    # Service worker i njegov registrator — NIKAD keširati.
    # sw.js je "prekidač" za sve ostale keševe: ako on sedi u kešu 7 dana,
    # popravka keša stiže korisnicima tek za 7 dana. Mora ispred pravila
    # za .js jer nginx uzima prvi regex location koji se poklopi.
    location ~* ^/(sw|sw-register)\.js$ {
        expires epoch;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Verzionisani CSS/JS (?v=) — dugo keširanje (bezbedno jer se URL menja pri izmeni)
    location ~* \.(css|js)$ {
        expires 7d;
    }

    # Ostali JSON
    location ~* \.(json)$ {
        expires 1h;
    }

    # Prilagođena 404 strana — važno za SEO (nema soft-404 preko SPA fallback-a)
    error_page 404 /404.html;

    # --- STARE STRANE REČI → HUB, TRAJNO (301) ------------------------------
    #
    # 30.07.2026. je izbor reči koje dobijaju svoju stranu prebačen sa ABECEDE na
    # UČESTALOST (nalaz P10): pre toga je 1.577 od 1.988 strana bilo na slovo „a“
    # (`aaa`, `aah`, `abadžija`, `abažur`), a `voda`, `hleb` i `sneg` nisu imali
    # stranu. Time je **1.672 starih adresa** prestalo da postoji.
    #
    # Bez ovog pravila svaka od njih vraća 404 — i to mesecima, jer Google svoje
    # adrese ne zaboravlja odmah. Sa 301 posetilac stigne na spisak svih reči, a
    # Google prenese vrednost stare adrese umesto da je izgubi.
    #
    # Namerno NIJE spisak od 1.672 pravila nego JEDNO: šta god pod `/rime-za/` ne
    # postoji na disku, ide na hub. Time su pokrivene i sve buduće promene izbora
    # reči, bez diranja ovog fajla.
    #
    # `^~` znači „ako se poklopi ovaj prefiks, ne gledaj regex pravila“ — inače bi
    # `location ~* \.(json)$` i slična mogla da presretnu zahtev.
    # Strane koje POSTOJE se serviraju normalno; samo nepostojeće idu na hub.
    location ^~ /rime-za/ {
        expires epoch;
        try_files $uri $uri/ $uri/index.html @rime_hub;
    }
    location @rime_hub {
        return 301 /rime-za/;
    }

    # PREIMENOVANA STRANA (26.08.2026, odluka vlasnice).
    # `/recnik-srpskog-jezika/` je obećavala rečnik srpskog jezika, a alat na njoj
    # traži reči po slovima (završava se na, počinje na, sadrži). Ljudi koji traže
    # značenje reči dolazili su i odlazili za 31 sekundu — 402 prikaza, 5 klikova,
    # CTR 1,2 % naspram oko 5 % koliko se očekuje na 6. mestu.
    # Nova adresa je `/rime-po-zavrsetku/` i govori šta alat zaista radi.
    # 301 (trajno) da Gugl prenese autoritet stare adrese na novu.
    location = /recnik-srpskog-jezika/ { return 301 /rime-po-zavrsetku/; }
    location = /recnik-srpskog-jezika  { return 301 /rime-po-zavrsetku/; }

    # HTML uvek revalidiraj (da nove verzije CSS/JS i meta odmah stignu)
    location / {
        expires epoch;
        try_files $uri $uri/ =404;
    }

    # Direktno serviraj 404.html bez dodatnog fallback-a
    location = /404.html {
        expires epoch;
        internal;
    }
}

# www → bez www, trajno (301)
#
# Do 29.07.2026. je `https://www.rimoteka.com/` vraćao 200 — ista strana na dve
# adrese, na svih 2.011 URL-ova. Kanonik je pokazivao na adresu bez www, pa
# Google nije indeksirao duplikat, ali kanonik je *nagoveštaj*, a 301 je
# *pravilo*: tek on prenosi težinu linkova.
#
# Blok stoji NA KRAJU, iza podrazumevanog — i to namerno (v. gore).
# `$request_uri` čuva putanju i upit. Adresa je apsolutna, jer se preusmerava
# na drugi domen; `absolute_redirect off` iznad se odnosi samo na preusmerenja
# koja nginx pravi sam (npr. kosa crta na kraju foldera).
#
# PRE SVAKE IZMENE OVOG FAJLA pokrenuti pravi nginx i proveriti PONAŠANJE:
#   curl -H "Host: rimoteka.com"      → 200
#   curl -H "Host: www.rimoteka.com"  → 301
#   curl -H "Host: bilo.sta"          → 200   (ne sme 301!)
# Provera sintakse nije dovoljna — 29.07. je sintaksa bila ispravna, a sajt pao.
server {
    listen 80;
    server_name www.rimoteka.com;
    return 301 https://rimoteka.com$request_uri;
}
