<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Rimoteka — reklama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:'Quicksand',sans-serif;
    background: radial-gradient(ellipse at 50% 50%, #f4eeff 0%, #e9e0fc 55%, #dccffb 100%);
    position:relative;
  }
  #svet { position:absolute; inset:0; perspective:600px; perspective-origin:50% 50%; }
  .cest { position:absolute; will-change:transform,opacity; user-select:none;
          transform-style:preserve-3d; white-space:nowrap; }
  .nota { font-family:'Quicksand',sans-serif; font-weight:700;
          text-shadow:0 .04em .12em rgba(58,42,110,.25); }
  .par { font-family:'Fredoka',sans-serif; font-weight:600; color:#5a3fd0;
         text-shadow:0 1px 6px rgba(255,255,255,.8); }
  .par i { font-style:normal; color:#b9a8e8; padding:0 .3em; }

  #centar { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
            text-align:center; will-change:transform,opacity; padding:1.1em 1.5em;
            border-radius:1.2em; background:rgba(255,255,255,.5);
            box-shadow:0 0 2.5em 1.5em rgba(255,255,255,.55); backdrop-filter:blur(2px); }
  #logo { display:flex; align-items:center; justify-content:center; gap:.18em; }
  #logo .r {
    width:2.1em; height:2.1em; border-radius:.55em; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#7a5af0,#5a3fd0); color:#fff;
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:1em;
    box-shadow:0 .18em .5em rgba(90,63,208,.35);
  }
  #logo .ime { font-family:'Fredoka',sans-serif; font-weight:700; color:#3a2a6e; }
  #slogan { font-family:'Quicksand',sans-serif; font-weight:500; color:#6d5fa3; margin-top:.55em; }

  #kraj { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
          background:linear-gradient(160deg,#5a3fd0,#7a5af0 60%,#9068f5); opacity:0; will-change:opacity; }
  #kraj .adr { font-family:'Fredoka',sans-serif; font-weight:700; color:#fff; }
  #kraj .bes { font-family:'Quicksand',sans-serif; font-weight:600; color:#e6ddff; margin-top:.5em; }
</style>
</head>
<body>
<div id="svet"></div>
<div id="centar">
  <div id="logo"><span class="r">R</span><span class="ime">imoteka</span></div>
  <div id="slogan">rimovanje za lakše štimovanje</div>
</div>
<div id="kraj">
  <div class="adr">rimoteka.com</div>
  <div class="bes">besplatan rečnik rima</div>
</div>
<script>
/* WARP POLJE — čestice (note i sitni parovi rima) lete iz dubine KA gledaocu,
   kao u igrici: z se smanjuje od dalekog horizonta do „kroza ekran".
   Deterministička animacija: stanje zavisi SAMO od t (sekunde). */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const PAROVI = [
  ['san','dan'], ['misao','smisao'], ['vreme','breme'], ['duga','tuga'],
  ['zvuk','muk'], ['slona','tona'], ['kosa','bosa'], ['suva','kuva'],
  ['malena','šarena'], ['zub','kub'],
];

const DUZINA = 11, KRAJ_OD = 9.2;

const CESTICE = [];
{
  const r = mulberry32(20260820);
  const simboli = ['♪','♫','♩','♬'];
  // vesela paleta (ne samo ljubičasta)
  const boje = ['#5a3fd0','#8b5cf6','#c94f8a','#e0559c','#f59e0b','#10b981','#3b82f6','#14b8a6','#ef7d4f'];
  for(let i=0;i<120;i++){
    const jePar = i % 4 === 3;                 // svaka četvrta je par reči
    let px = (r()-.5)*2, py = (r()-.5)*2;      // pravac (u jedinicama)
    if(jePar && Math.hypot(px, py) < .75){ const k = .9/Math.max(.2, Math.hypot(px, py)); px *= k; py *= k; } // parovi ne lete kroz logo
    CESTICE.push({
      tip: jePar ? 'par' : 'nota',
      s: jePar ? null : simboli[Math.floor(r()*simboli.length)],
      par: jePar ? PAROVI[Math.floor(r()*PAROVI.length)] : null,
      px, py,
      faza: r(),                               // gde je u ciklusu dubine
      brz: .10 + r()*.10,                      // koliko brzo prilazi
      rot: (r()-.5)*100,                       // 3D rotacija
      rotBrz: (r()-.5)*1.6,
      vel: .5 + r()*.8,
      boja: boje[Math.floor(r()*boje.length)],
    });
  }
}

function stanje(t, W, H){
  const el = [];
  const cx = W/2, cy = H/2;
  const jed = Math.min(W, H)/390;
  const gasKraj = t>KRAJ_OD-0.8 ? Math.max(0,(KRAJ_OD-t)/.8) : 1;
  for(const c of CESTICE){
    // dubina: od 1 (daleko) ka 0 (kod gledaoca); ciklično
    const z = 1 - ((c.faza + t*c.brz) % 1);
    if(z < .06 || z > .97) continue;
    const k = 1/z;                              // perspektivni faktor
    const x = cx + c.px * k * cx * .55;
    const y = cy + c.py * k * cy * .55;
    if(x < -W*.25 || x > W*1.25 || y < -H*.25 || y > H*1.25) continue;
    const blizina = Math.min(1, (1-z)*2.2);     // jače kad je blizu
    const daljina = Math.min(1, (1-z)*6);       // pojava iz dubine
    const op = daljina * Math.min(1, z/.12) * (0.6 + blizina*.4) * gasKraj;
    el.push({tip:c.tip, s:c.s, par:c.par, x, y,
             vel:c.vel*jed*(0.35+ (1-z)*1.1),   // raste kako prilazi
             rotX: Math.sin(t*c.rotBrz + c.faza*7)*45, rotY: Math.cos(t*c.rotBrz*0.8 + c.faza*9)*45, rotZ: c.rot*Math.sin(t*.4+c.faza*5),
             op, boja:c.boja});
  }
  const opCentar = Math.min(1, t/.8) * (t > KRAJ_OD-0.7 ? Math.max(0,(KRAJ_OD-t)/.7) : 1);
  const opKraj = t > KRAJ_OD ? Math.min(1,(t-KRAJ_OD)/.6) : 0;
  return {el, opCentar, opKraj, jed};
}

function crtaj(t){
  const W = innerWidth, H = innerHeight;
  const st = stanje(t, W, H);
  const svet = document.getElementById('svet');
  svet.innerHTML = '';
  for(const e of st.el){
    const d = document.createElement('div');
    if(e.tip === 'nota'){
      d.className = 'cest nota';
      d.textContent = e.s;
      d.style.color = e.boja;
      d.style.fontSize = (e.vel*46) + 'px';
    } else {
      d.className = 'cest par';
      d.innerHTML = `${e.par[0]}<i>•</i>${e.par[1]}`;
      d.style.fontSize = (e.vel*28) + 'px';
    }
    d.style.cssText += `;left:${e.x}px;top:${e.y}px;opacity:${e.op};
      transform:translate(-50%,-50%) rotateX(${e.rotX}deg) rotateY(${e.rotY}deg) rotate(${e.rotZ}deg)`;
    svet.appendChild(d);
  }
  const c = document.getElementById('centar');
  c.style.opacity = st.opCentar;
  c.style.transform = `translate(-50%,-50%) scale(${.97 + .03*Math.min(1, st.opCentar)})`;
  c.querySelector('#logo .ime').style.fontSize = (st.jed*.95*40) + 'px';
  c.querySelector('#logo .r').style.fontSize = (st.jed*.56*40) + 'px';
  c.querySelector('#slogan').style.fontSize = (st.jed*.34*40) + 'px';
  const k = document.getElementById('kraj');
  k.style.opacity = st.opKraj;
  k.querySelector('.adr').style.fontSize = (st.jed*1.0*40) + 'px';
  k.querySelector('.bes').style.fontSize = (st.jed*.4*40) + 'px';
}

const q = new URLSearchParams(location.search);
if(q.has('t')) crtaj(parseFloat(q.get('t')));
else { let t0 = null; function tick(ts){ if(!t0) t0 = ts; crtaj((ts-t0)/1000); requestAnimationFrame(tick); } requestAnimationFrame(tick); }
</script>
</body>
</html>
