# STARE STRANE REČI (nalaz S-26, audit 07.09.2026). Do 07.09. je SVAKA nepostojeća adresa pod
# `/rime-za/` išla 301 na hub — pa je Google imao 974 „Page with redirect" i meko-404 signal
# za svaku reč koju neko otkuca u adresu. Sada 301 dobija SAMO adresa koja je nekad postojala
# (spisak iz sitemapa od 29.07.2026, 1.670 adresa: `nginx-stare-strane.map`); sve ostalo je
# pravi 404 sa lepom stranom. `map` mora u http kontekst — ovaj fajl je uključen tamo.
map $uri $rime_stara {
    default 0;
    include /etc/nginx/conf.d/rime-stare-strane.map;
}
# S9 (08.09.2026): velika slova u adresi strane reči → 301 na pravu (malu) adresu. `map` poredi bez
# razlike velikih i malih slova, pa je dovoljno „svaka strana → ona sama" (fajl pravi gen_pages.py).
map $uri $rime_mala {
    default "";
    include /etc/nginx/conf.d/rime-strane-mala.map;
}

# SEO-2 (22.09.2026): kanonikal za `/?rec=<reč>` u SIROVOM HTML-u. Za 1.989 reči sa stranom mapa daje
# `/rime-za/<reč>/` (piše je `build/gen_pages.py`), za sve ostalo `/` – isto što piše u index.html.
# `sub_filter` ispod prepiše red kanonikala pre gzip-a; JS (`osveziSeoZaRec`) i dalje radi isto posle.
map $arg_rec $kanon_rec {
    default "/";
    include /etc/nginx/conf.d/rime-kanon-rec.map;
}

server {
    # `default_server` je OBAVEZAN i nije ukras.
    #
    # 29.07.2026. je sajt bio oboren ~3 minuta zato što je ovo nedostajalo:
    # `server_name _` NIJE hvatalica za sve domene — `_` je namerno nevažeće ime
    # koje se nikad ne poklopi sa `Host` zaglavljem. Ovaj blok je hvatao sve
    # zahteve samo zato što je bio PRVI, a nginx prvi blok uzima za podrazumevani
    # kad nijedan nema `default_server`. Čim je ispred njega dodat blok za www,
    # www je postao podrazumevani i preusmeravao je i `rimoteka.com` na samog
    # sebe — beskonačna petlja.
    #
    # Sa izričitim `default_server` redosled blokova više ništa ne znači.
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relativni redirecti (Location: /) da se sačuva https i izbegne http→https chain
    absolute_redirect off;

    # Gzip da se veliki rečnik (reci.txt ~3MB) brzo učita
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Verzija nginx-a se ne oglašava (nalaz N-12, audit 07.09.2026).
    server_tokens off;

    # --- Sigurnosni hederi (primenjuju se na sve odgovore) ---
    # HSTS (nalaz V3): 300 s od 07.09.2026, ništa nije puklo → godinu (31536000) od 08.09.2026.
    # Traefik ispred terminira TLS, zaglavlje prolazi.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;   # microphone=(self): glas u igri (BZ-1, 22.09.2026); () je od 08.09. gušio 🎤
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://rimoteka-prijave.jovana-daskovic.workers.dev https://sr.wiktionary.org https://sr.wikipedia.org https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;

    # Definicije i rečnik: od 24.08.2026 adresa nosi OTISAK sadržaja (`?v=<sha>`), pa se
    # menja kad god se fajl promeni — zato dugačak keš više NIJE opasan (nalaz S-21, audit
    # 07.09.2026). Ranije `expires epoch` je terao svakog povratnika da revalidira 2,7 MB rečnika.
    # SEO-5 (22.09.2026): ista strana na dve adrese. `/index.html` i `/x/index.html` idu na čistu adresu, a folder
    # velikim slovima (`/RIME-ZA/…`) na mala. Gleda se `$request_uri` (ono što je klijent tražio), pa unutrašnji
    # `try_files … index.html` ne ulazi u petlju.
    if ($request_uri ~ "^(/(?:.*/)?)index\.html(\?.*)?$") { return 301 $1$is_args$args; }
    if ($request_uri ~ "^/RIME-ZA/(.*)$") { return 301 /rime-za/$1; }

    location = /definicije.json {
        expires 365d;
    }
    location ~* /reci(_jekavica)?\.txt$ {
        expires 365d;
    }

    # Service worker i njegov registrator — NIKAD keširati.
    # sw.js je "prekidač" za sve ostale keševe: ako on sedi u kešu 7 dana,
    # popravka keša stiže korisnicima tek za 7 dana. Mora ispred pravila
    # za .js jer nginx uzima prvi regex location koji se poklopi.
    # PAŽNJA (nalaz S1/S-07, audit 07.09.2026): blok koji ima SVOJ `add_header` ne nasleđuje
    # NIJEDNO zaglavlje iz server bloka — zato se sigurnosna zaglavlja ovde PONAVLJAJU.
    # `expires epoch` je izbačen (davao je duplo Cache-Control).
    location ~* ^/(sw|sw-register)\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;   # microphone=(self): glas u igri (BZ-1, 22.09.2026); () je od 08.09. gušio 🎤
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://rimoteka-prijave.jovana-daskovic.workers.dev https://sr.wiktionary.org https://sr.wikipedia.org https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;
    }

    # Verzionisani CSS/JS (?v=) — dugo keširanje (bezbedno jer se URL menja pri izmeni)
    location ~* \.(css|js)$ {
        expires 7d;
    }
    # Fontovi sa našeg servera (nalaz S-06): ime fajla se menja kad se font menja, keš godinu.
    location ~* \.(woff2|woff)$ {
        expires 365d;
    }

    # Ostali JSON (svi nose ?v=<sha> — v. scripts/osvezi-verzije-podataka.mjs), dugačak keš (S-21)
    location ~* \.(json)$ {
        expires 365d;
    }

    # Prilagođena 404 strana — važno za SEO (nema soft-404 preko SPA fallback-a)
    error_page 404 /404.html;

    # --- STARE STRANE REČI → HUB, TRAJNO (301) ------------------------------
    #
    # 30.07.2026. je izbor reči koje dobijaju svoju stranu prebačen sa ABECEDE na
    # UČESTALOST (nalaz P10): pre toga je 1.577 od 1.988 strana bilo na slovo „a“
    # (`aaa`, `aah`, `abadžija`, `abažur`), a `voda`, `hleb` i `sneg` nisu imali
    # stranu. Time je **1.672 starih adresa** prestalo da postoji.
    #
    # Bez ovog pravila svaka od njih vraća 404 — i to mesecima, jer Google svoje
    # adrese ne zaboravlja odmah. Sa 301 posetilac stigne na spisak svih reči, a
    # Google prenese vrednost stare adrese umesto da je izgubi.
    #
    # Namerno NIJE spisak od 1.672 pravila nego JEDNO: šta god pod `/rime-za/` ne
    # postoji na disku, ide na hub. Time su pokrivene i sve buduće promene izbora
    # reči, bez diranja ovog fajla.
    #
    # `^~` znači „ako se poklopi ovaj prefiks, ne gledaj regex pravila“ — inače bi
    # `location ~* \.(json)$` i slična mogla da presretnu zahtev.
    # Strane koje POSTOJE se serviraju normalno; samo nepostojeće idu na hub.
    location ^~ /rime-za/ {
        expires epoch;
        try_files $uri $uri/ $uri/index.html @rime_nema;
    }
    # Stara (ukinuta) strana → hub, trajno. Adresa koja nikad nije postojala → 404 (S-26).
    location @rime_nema {
        if ($rime_mala)  { return 301 $rime_mala; }   # S9: /rime-za/Beograd/ → /rime-za/beograd/
        if ($rime_stara) { return 301 /rime-za/; }
        return 404;
    }

    # PREIMENOVANA STRANA (26.08.2026, odluka vlasnice).
    # `/recnik-srpskog-jezika/` je obećavala rečnik srpskog jezika, a alat na njoj
    # traži reči po slovima (završava se na, počinje na, sadrži). Ljudi koji traže
    # značenje reči dolazili su i odlazili za 31 sekundu — 402 prikaza, 5 klikova,
    # CTR 1,2 % naspram oko 5 % koliko se očekuje na 6. mestu.
    # Nova adresa je `/rime-po-zavrsetku/` i govori šta alat zaista radi.
    # 301 (trajno) da Gugl prenese autoritet stare adrese na novu.
    location = /recnik-srpskog-jezika/ { return 301 /rime-po-zavrsetku/; }
    location = /recnik-srpskog-jezika  { return 301 /rime-po-zavrsetku/; }

    # HTML uvek revalidiraj (da nove verzije CSS/JS i meta odmah stignu)
    location / {
        expires epoch;
        sub_filter '<link rel="canonical" href="https://rimoteka.com/">' '<link rel="canonical" href="https://rimoteka.com$kanon_rec">';
        sub_filter_once on;
        sub_filter_types text/html;
        try_files $uri $uri/ =404;
    }

    # PF-3 (22.09.2026): pod adresom /app.js servira se MINIFIKOVAN `app.min.js` (scripts/minifikuj.mjs);
    # izvor sa komentarima ostaje app.js u repou. Bez add_header ovde – nasleđuje zaglavlja servera.
    location = /app.js {
        alias /usr/share/nginx/html/app.min.js;
        expires 7d;
    }

    # Direktno serviraj 404.html bez dodatnog fallback-a
    location = /404.html {
        expires epoch;
        internal;
    }
}

# www → bez www, trajno (301)
#
# Do 29.07.2026. je `https://www.rimoteka.com/` vraćao 200 — ista strana na dve
# adrese, na svih 2.011 URL-ova. Kanonik je pokazivao na adresu bez www, pa
# Google nije indeksirao duplikat, ali kanonik je *nagoveštaj*, a 301 je
# *pravilo*: tek on prenosi težinu linkova.
#
# Blok stoji NA KRAJU, iza podrazumevanog — i to namerno (v. gore).
# `$request_uri` čuva putanju i upit. Adresa je apsolutna, jer se preusmerava
# na drugi domen; `absolute_redirect off` iznad se odnosi samo na preusmerenja
# koja nginx pravi sam (npr. kosa crta na kraju foldera).
#
# PRE SVAKE IZMENE OVOG FAJLA pokrenuti pravi nginx i proveriti PONAŠANJE:
#   curl -H "Host: rimoteka.com"      → 200
#   curl -H "Host: www.rimoteka.com"  → 301
#   curl -H "Host: bilo.sta"          → 200   (ne sme 301!)
# Provera sintakse nije dovoljna — 29.07. je sintaksa bila ispravna, a sajt pao.
server {
    listen 80;
    server_name www.rimoteka.com;
    return 301 https://rimoteka.com$request_uri;
}
