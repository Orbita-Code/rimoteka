server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip da se veliki rečnik (reci.txt ~3MB) brzo učita
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Sigurnosni hederi (primenjuju se na sve odgovore) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://sr.wiktionary.org https://sr.wikipedia.org; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;

    # Definicije se često dopunjuju — bez keša, da svi uvek vide najnovije
    location = /definicije.json {
        expires epoch;
    }

    # Rečnik + verzionisani CSS/JS (?v=) — dugo keširanje
    location ~* \.(txt|css|js)$ {
        expires 7d;
    }

    # Ostali JSON
    location ~* \.(json)$ {
        expires 1h;
    }

    # HTML uvek revalidiraj (da nove verzije CSS/JS i meta odmah stignu)
    location / {
        expires epoch;
        try_files $uri $uri/ /index.html;
    }
}
