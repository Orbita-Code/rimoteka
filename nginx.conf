server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relativni redirecti (Location: /) da se sačuva https i izbegne http→https chain
    absolute_redirect off;

    # Gzip da se veliki rečnik (reci.txt ~3MB) brzo učita
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Sigurnosni hederi (primenjuju se na sve odgovore) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://sr.wiktionary.org https://sr.wikipedia.org https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;

    # Definicije se često dopunjuju — bez keša, da svi uvek vide najnovije
    location = /definicije.json {
        expires epoch;
    }

    # Rečnik (reci.txt / reci_jekavica.txt) se menja — uvek revalidiraj (ETag → 304)
    # da izmene/čišćenja rečnika ODMAH stignu korisnicima, a ne tek za 7 dana.
    location ~* /reci(_jekavica)?\.txt$ {
        expires epoch;
    }

    # Service worker i njegov registrator — NIKAD keširati.
    # sw.js je "prekidač" za sve ostale keševe: ako on sedi u kešu 7 dana,
    # popravka keša stiže korisnicima tek za 7 dana. Mora ispred pravila
    # za .js jer nginx uzima prvi regex location koji se poklopi.
    location ~* ^/(sw|sw-register)\.js$ {
        expires epoch;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Verzionisani CSS/JS (?v=) — dugo keširanje (bezbedno jer se URL menja pri izmeni)
    location ~* \.(css|js)$ {
        expires 7d;
    }

    # Ostali JSON
    location ~* \.(json)$ {
        expires 1h;
    }

    # Prilagođena 404 strana — važno za SEO (nema soft-404 preko SPA fallback-a)
    error_page 404 /404.html;

    # HTML uvek revalidiraj (da nove verzije CSS/JS i meta odmah stignu)
    location / {
        expires epoch;
        try_files $uri $uri/ =404;
    }

    # Direktno serviraj 404.html bez dodatnog fallback-a
    location = /404.html {
        expires epoch;
        internal;
    }
}
